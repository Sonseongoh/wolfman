# 웹 빌드를 떠서 GitHub Pages(gh-pages)에 올린다.
#
# 수동 실행 전용이다. push 트리거를 두지 않는 이유는 무료 빌드 분이 월 200분인데
# 1회 빌드가 약 27분이라, dev 커밋마다 돌리면 한 달을 못 버티기 때문이다.
# 배포는 "지금 이 리비전을 심사자에게 보이겠다"는 판단이므로 사람이 누르는 편이 맞다.
#
# 빌드는 러너가 아니라 Unity Build Automation 이 한다 — 러너에는 유니티가 없다.
# 자세한 배경은 Docs/Build.md 와 ADR 0003 참고.

name: 웹 배포

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 빌드할 브랜치
        required: true
        default: dev
      commit:
        description: 특정 커밋 (비우면 브랜치 최신)
        required: false
        default: ''
      clean:
        description: 캐시를 버리고 처음부터 빌드 (느림)
        type: boolean
        default: false

# gh-pages 에 push 해야 한다
permissions:
  contents: write

# 두 배포가 겹치면 gh-pages 가 엉킨다. 앞의 것을 끝까지 두고 기다린다
concurrency:
  group: deploy-web
  cancel-in-progress: false

env:
  UBA_API: https://build-api.cloud.unity3d.com/api/v1
  ORG_ID: '14569786065700'
  PROJECT_ID: wolfman
  TARGET_ID: webgl-dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 큐 대기 + 빌드(약 27분) + 다운로드. 넉넉히 잡는다
    timeout-minutes: 120

    steps:
      - name: API 키 확인
        env:
          KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::UNITY_BUILD_API_KEY 시크릿이 없다. Docs/Build.md 의 '준비물' 참고."
            exit 1
          fi

      - name: 빌드 요청
        id: trigger
        env:
          KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
          BRANCH: ${{ inputs.branch }}
          COMMIT: ${{ inputs.commit }}
          CLEAN: ${{ inputs.clean }}
        run: |
          set -euo pipefail

          body=$(jq -nc \
            --arg branch "$BRANCH" \
            --arg commit "$COMMIT" \
            --argjson clean "$CLEAN" \
            '{clean: $clean, delay: 0, branch: $branch}
             + (if $commit == "" then {} else {commit: $commit} end)')

          resp=$(curl -sS -X POST \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            "$UBA_API/orgs/$ORG_ID/projects/$PROJECT_ID/buildtargets/$TARGET_ID/builds" \
            -d "$body")

          # 성공하면 배열, 실패하면 {error: ...} 로 온다
          if ! number=$(jq -er 'if type == "array" then .[0].build else .build end' <<<"$resp"); then
            echo "::error::빌드 요청 실패: $(jq -c . <<<"$resp")"
            exit 1
          fi

          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "빌드 #$number 요청됨 (branch=$BRANCH commit=${COMMIT:-최신} clean=$CLEAN)"

      - name: 빌드 완료 대기
        id: wait
        env:
          KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
          NUMBER: ${{ steps.trigger.outputs.number }}
        run: |
          set -euo pipefail
          url="$UBA_API/orgs/$ORG_ID/projects/$PROJECT_ID/buildtargets/$TARGET_ID/builds/$NUMBER"
          prev=''

          while true; do
            info=$(curl -sS -H "Authorization: Bearer $KEY" "$url")
            status=$(jq -r '.buildStatus // "unknown"' <<<"$info")

            # 상태가 바뀔 때만 찍는다 — 로그가 30초마다 한 줄씩 쌓이면 읽기 어렵다
            if [ "$status" != "$prev" ]; then
              echo "$(date -u +%H:%M:%S) $status"
              prev=$status
            fi

            case "$status" in
              success)
                echo "revision=$(jq -r '.lastBuiltRevision // ""' <<<"$info")" >> "$GITHUB_OUTPUT"
                break
                ;;
              failure|canceled|cancelled)
                echo "::error::빌드 $status — 로그: https://cloud.unity.com/home/cloud-build"
                curl -sS -H "Authorization: Bearer $KEY" "$url/log" | tail -n 60
                exit 1
                ;;
            esac
            sleep 30
          done

      - name: 산출물 다운로드
        env:
          KEY: ${{ secrets.UNITY_BUILD_API_KEY }}
          NUMBER: ${{ steps.trigger.outputs.number }}
        run: |
          set -euo pipefail

          # 다운로드 URL 에 5분짜리 토큰이 박혀 있다. 받기 직전에 새로 조회해야 한다
          info=$(curl -sS -H "Authorization: Bearer $KEY" \
            "$UBA_API/orgs/$ORG_ID/projects/$PROJECT_ID/buildtargets/$TARGET_ID/builds/$NUMBER")

          href=$(jq -er '.links.artifacts[] | select(.name == ".ZIP file") | .files[0].href' <<<"$info") || {
            echo "::error::zip 산출물을 찾지 못했다"
            exit 1
          }

          curl -sS -L --retry 3 --retry-delay 5 "$href" -o build.zip
          unzip -q build.zip -d unzipped
          echo "받은 크기: $(du -h build.zip | cut -f1)"

      - name: 산출물 검증
        id: verify
        run: |
          set -euo pipefail

          # zip 내부 구조가 유니티 버전에 따라 한 겹 더 들어가는 경우가 있다.
          # index.html 이 있는 곳을 웹 루트로 삼는다
          index=$(find unzipped -maxdepth 4 -name index.html | head -1)
          if [ -z "$index" ]; then
            echo "::error::index.html 이 없다. zip 구조: $(find unzipped -maxdepth 2 | head -20)"
            exit 1
          fi
          root=$(dirname "$index")
          echo "root=$root" >> "$GITHUB_OUTPUT"

          # index.html 이 가리키는 해시 파일이 실제로 있는지 본다.
          # 하나라도 없으면 로더가 브라우저에서 죽는다 (ADR 0003)
          missing=0
          for f in $(grep -oE '[a-f0-9]{32}\.[a-z.]+' "$index" | sort -u); do
            if [ -f "$root/Build/$f" ]; then
              echo "  OK   $f"
            else
              echo "  없음 $f"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -gt 0 ]; then
            echo "::error::index.html 이 참조하는 파일 $missing 개가 산출물에 없다"
            exit 1
          fi

      - name: gh-pages 갱신
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ROOT: ${{ steps.verify.outputs.root }}
          NUMBER: ${{ steps.trigger.outputs.number }}
          REVISION: ${{ steps.wait.outputs.revision }}
          BRANCH: ${{ inputs.branch }}
        run: |
          set -euo pipefail

          git clone --branch gh-pages --single-branch --depth 1 \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pages

          cd pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 해시 파일명을 쓰므로 덮어쓰기가 아니라 "비우고 채우기" 여야 한다.
          # 덮어쓰면 옛 빌드의 해시 파일이 지워지지 않고 영원히 쌓인다 (ADR 0003)
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.nojekyll' -exec rm -rf {} +
          cp -r "../$ROOT/." .

          # 유니티가 만들어주지 않는다. 없으면 Pages 의 Jekyll 이 _ 로 시작하는 파일을 무시한다
          touch .nojekyll

          if [ -z "$(git status --porcelain)" ]; then
            echo "라이브와 같은 산출물이다. 배포할 것이 없다."
            exit 0
          fi

          git add -A
          git commit -m "deploy: ${BRANCH}@${REVISION:0:7} 빌드 배포 (UBA #${NUMBER})"
          git push origin gh-pages
          echo "배포 완료: https://sonseongoh.github.io/wolfman/"
